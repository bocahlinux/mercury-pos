version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercury_pos
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mercury_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury_pos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://mercury:${DB_PASSWORD:-mercury_dev_password}@db:5432/mercury_pos
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles

  # ── React Web Frontend ───────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/var/www/media:ro
      - static_files:/var/www/static:ro
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  media_files:
  static_files:
