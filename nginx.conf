# Nginx Reverse Proxy Configuration for Mercury POS
# Routes: /api/* → backend, /media/* → backend, /static/* → backend, /* → web frontend

upstream backend {
    server backend:8000;
}

upstream web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # ── API ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Media files ───────────────────────────────────
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Static files ──────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check ──────────────────────────────────
    location /health/ {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Frontend (SPA fallback) ───────────────────────
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SPA: return index.html for non-file routes
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ─────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
